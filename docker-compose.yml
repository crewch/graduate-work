services:
  core-api:
    image: core-api
    container_name: core-api
    build: ./src/backend/core-api
    ports:
      - '4200:4200'
    environment:
      PORT: 4200
      DATABASE_URL: postgresql://crewch:2003@postgres:5432/mydb?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_network
    command: sh -c "yarn prisma migrate deploy && yarn prisma generate && yarn start:prod"

  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: crewch
      POSTGRES_PASSWORD: 2003
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crewch -d mydb']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    networks:
      - api_network

volumes:
  postgres_data:
  node_modules:

networks:
  api_network:
    driver: bridge
